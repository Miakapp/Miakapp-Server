name: Relay checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the pinned control-plane contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Miakapp/Miakapp-V3
          ref: abee78b80383f0e7c900dbcaede3741095f08c35
          path: .contract/miakapp-v3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Verify module contents
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal test)"
      - name: Vet packages
        run: go vet ./...
      - name: Run race-enabled tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Run the canonical control-plane authentication vectors
        run: ./scripts/check-control-plane-integration.sh "$GITHUB_WORKSPACE/.contract/miakapp-v3"
      - name: Build relay binary
        run: go build ./cmd/miakapp-server

  miakapi-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the pinned MiakAPI coordinator SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Miakapp/MiakAPI
          ref: 9463294af3353c128dced85309c468abddf87ad4
          path: miakapi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.23'
      - name: Build the pinned MiakAPI coordinator SDK
        working-directory: miakapi
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Run the real SDK-to-relay integration
        run: ./scripts/check-miakapi-integration.sh "$GITHUB_WORKSPACE/miakapi"

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build non-publishing image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: miakapp-server:ci
