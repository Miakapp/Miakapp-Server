services:
  miakapp-server:
    image: miakapp-server:development
    build: .
    container_name: miakapp-server
    environment:
      MIAKAPP_ALLOWED_ORIGINS: ${MIAKAPP_ALLOWED_ORIGINS:-}
      MIAKAPP_CONTROL_PLANE_ISSUER: ${MIAKAPP_CONTROL_PLANE_ISSUER:?required}
      MIAKAPP_CONTROL_PLANE_JWKS_URL: ${MIAKAPP_CONTROL_PLANE_JWKS_URL:?required}
      MIAKAPP_FIREBASE_PROJECT_ID: ${MIAKAPP_FIREBASE_PROJECT_ID:?required}
      MIAKAPP_LISTEN_ADDRESS: :3000
      MIAKAPP_RELAY_AUDIENCE: ${MIAKAPP_RELAY_AUDIENCE:?required}
    ports:
      - '3000:3000'
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
